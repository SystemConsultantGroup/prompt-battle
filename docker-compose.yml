services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      # LLM provider — set ONE of the two keys below (or neither for offline FakeProvider).
      OPENAI_API_KEY:   ${OPENAI_API_KEY:-}
      OPENAI_MODEL:     ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL:      ${CLAUDE_MODEL:-claude-opus-4-8}
      DB_PATH: /data/app.sqlite
    volumes:
      # Mount a named volume for the SQLite DB so data persists across restarts.
      - db-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db-data:
